<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orbit Shot</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--space:#070b1a;--amber:#ffb020;--cyan:#4fd1ff;--pink:#ff4fa3;--text:#e8efff;--muted:#8c9bc4}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--space);color:var(--text);font-family:'Manrope',system-ui,sans-serif;touch-action:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
.bar{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:max(14px,env(safe-area-inset-top)) 18px 0;pointer-events:none}
.title{font-family:'Unbounded',sans-serif;font-weight:700;font-size:15px;letter-spacing:.02em}
.sub{font-size:13px;color:var(--muted);margin-top:4px}
.tools{display:flex;gap:8px;pointer-events:auto}
.chip{font:inherit;font-size:13px;font-weight:600;color:var(--text);background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.16);padding:8px 14px;border-radius:12px;cursor:pointer;backdrop-filter:blur(8px)}
.chip:hover{background:rgba(255,255,255,.14)}
.chip:focus-visible,.go:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.hint{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:14px;color:var(--muted);pointer-events:none;transition:opacity .4s}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;
  background:rgba(7,11,26,.78);backdrop-filter:blur(6px);transition:opacity .35s,visibility .35s}
.ov.hide{opacity:0;visibility:hidden}
.panel{width:100%;max-width:440px;padding:32px 28px;border-radius:24px;background:#0f1630;
  border:1px solid rgba(79,209,255,.25);box-shadow:0 0 80px rgba(79,209,255,.12);text-align:center}
h1{font-family:'Unbounded',sans-serif;font-weight:700;font-size:clamp(30px,8vw,42px);line-height:1.05}
.panel p{margin:14px 0 22px;color:var(--muted);line-height:1.55}
.stars{font-size:36px;letter-spacing:6px;color:var(--amber);margin:12px 0 4px}
.go{font:inherit;font-weight:700;font-size:16px;color:#1b1200;background:var(--amber);border:0;padding:13px 30px;
  border-radius:14px;cursor:pointer;box-shadow:0 8px 28px rgba(255,176,32,.35)}
.go:active{transform:scale(.97)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0 4px}
.lv{font:inherit;font-weight:700;padding:14px 0;border-radius:14px;border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.05);color:var(--text);cursor:pointer}
.lv small{display:block;color:var(--amber);font-size:12px;margin-top:2px;min-height:15px}
.lv:hover{border-color:var(--cyan)}
</style>
</head>
<body>
<canvas id="c" aria-label="Orbit Shot game"></canvas>
<div class="bar">
  <div><div class="title" id="lvTitle"></div><div class="sub" id="shots"></div></div>
  <div class="tools"><button class="chip" id="retry">Retry</button><button class="chip" id="menu">Levels</button></div>
</div>
<div class="hint" id="hint">Drag backwards from the probe, then let go</div>

<div class="ov" id="ovMenu">
  <div class="panel">
    <h1>Orbit Shot</h1>
    <p>Fling the probe past planets and let their gravity bend its path into the glowing gate. Pink worlds push away.</p>
    <div class="grid" id="grid"></div>
  </div>
</div>
<div class="ov hide" id="ovWin">
  <div class="panel">
    <h1 id="winTitle">Gate reached</h1>
    <div class="stars" id="winStars"></div>
    <p id="winMsg"></p>
    <button class="go" id="next">Next level</button>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $('c'), ctx = cv.getContext('2d');
  const WW = 1000, WH = 600;           // virtual world size
  let sc = 1, ox = 0, oy = 0, DPR = 1;
  function resize(){
    DPR = Math.min(devicePixelRatio || 1, 2);
    cv.width = innerWidth * DPR; cv.height = innerHeight * DPR;
    sc = Math.min(innerWidth / WW, innerHeight / WH) * .96;
    ox = (innerWidth - WW * sc) / 2; oy = (innerHeight - WH * sc) / 2;
  }
  addEventListener('resize', resize); resize();

  // Level data. b = bodies: x, y, r (radius), rep = repels instead of attracts
  const LEVELS = [
    { name: 'First Light',   s: [110, 300], g: [890, 300], b: [{x:500,y:300,r:38}] },
    { name: 'Two Worlds',    s: [110, 520], g: [890, 90],  b: [{x:400,y:300,r:34},{x:700,y:390,r:30}] },
    { name: 'The Long Arc',  s: [100, 90],  g: [900, 510], b: [{x:350,y:350,r:40},{x:620,y:190,r:30},{x:710,y:450,r:30}] },
    { name: 'Push and Pull', s: [100, 300], g: [900, 300], b: [{x:500,y:110,r:36},{x:500,y:490,r:36},{x:500,y:300,r:26,rep:1}] },
    { name: 'Triple Gate',   s: [500, 545], g: [500, 60],  b: [{x:290,y:300,r:40},{x:710,y:300,r:40},{x:500,y:300,r:24,rep:1}] },
    { name: 'Deep Slingshot',s: [100, 540], g: [900, 60],  b: [{x:300,y:200,r:34},{x:520,y:420,r:44},{x:740,y:200,r:34},{x:880,y:400,r:26,rep:1}] }
  ];
  const K = 3500;                       // gravity strength per radius²
  const MAXPULL = 150, POWER = 3.4;

  // progress (safe storage)
  let prog = {};
  try { prog = JSON.parse(localStorage.getItem('orbit-shot') || '{}'); } catch(e){}
  const save = () => { try { localStorage.setItem('orbit-shot', JSON.stringify(prog)); } catch(e){} };

  const stars = Array.from({length: 120}, () => ({ x: Math.random() * WW, y: Math.random() * WH, z: Math.random(), p: Math.random() * 6 }));

  let li = 0, L, probe, mode, shots, trail, aim = null, parts = [], t = 0;

  function load(i){
    li = i; L = LEVELS[i]; shots = 0; parts = [];
    $('lvTitle').textContent = (i + 1) + '. ' + L.name;
    $('hint').style.opacity = 1;
    ovHide('ovMenu'); ovHide('ovWin'); respawn(); updateShots();
  }
  function respawn(){ probe = { x: L.s[0], y: L.s[1], vx: 0, vy: 0 }; trail = []; mode = 'aim'; aim = null; }
  function updateShots(){ $('shots').textContent = 'Launches: ' + shots; }
  const ovShow = id => $(id).classList.remove('hide');
  const ovHide = id => $(id).classList.add('hide');

  function accel(x, y){
    let ax = 0, ay = 0;
    for (const b of L.b){
      const dx = b.x - x, dy = b.y - y, d2 = Math.max(dx * dx + dy * dy, 900), d = Math.sqrt(d2);
      const a = K * b.r * b.r / d2 * (b.rep ? -.8 : 1);
      ax += a * dx / d; ay += a * dy / d;
    }
    return [ax, ay];
  }
  function step(p, dt){
    const [ax, ay] = accel(p.x, p.y);
    p.vx += ax * dt; p.vy += ay * dt; p.x += p.vx * dt; p.y += p.vy * dt;
  }
  function burst(x, y, c){
    for (let i = 0; i < 26; i++){
      const a = Math.random() * 6.28, s = 40 + Math.random() * 220;
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, c });
    }
  }

  // --- input ---
  const toWorld = e => [(e.clientX - ox) / sc, (e.clientY - oy) / sc];
  addEventListener('pointerdown', e => {
    if (mode !== 'aim' || e.target.closest('.ov,.tools')) return;
    aim = { x: toWorld(e)[0], y: toWorld(e)[1], cx: toWorld(e)[0], cy: toWorld(e)[1] };
  });
  addEventListener('pointermove', e => { if (aim){ [aim.cx, aim.cy] = toWorld(e); } });
  addEventListener('pointerup', () => {
    if (!aim) return;
    const v = pull();
    aim = null;
    if (v.len < 12) return;
    probe.vx = v.vx; probe.vy = v.vy; mode = 'fly'; shots++; updateShots(); trail = [];
    $('hint').style.opacity = 0;
  });
  function pull(){
    let dx = aim.x - aim.cx, dy = aim.y - aim.cy; const len = Math.min(Math.hypot(dx, dy), MAXPULL);
    const a = Math.atan2(dy, dx);
    return { len, vx: Math.cos(a) * len * POWER, vy: Math.sin(a) * len * POWER, a };
  }
  $('retry').onclick = () => { if (mode !== 'won') respawn(); };
  $('menu').onclick = openMenu;
  $('next').onclick = () => { if (li + 1 < LEVELS.length) load(li + 1); else openMenu(); };
  addEventListener('keydown', e => { if (e.key === 'r' && mode !== 'won') respawn(); });
  addEventListener('pointercancel', () => { aim = null; });

  function openMenu(){
    $('grid').innerHTML = LEVELS.map((l, i) =>
      `<button class="lv" data-i="${i}">${i + 1}<small>${'★'.repeat(prog[i] || 0)}</small></button>`).join('');
    $('grid').querySelectorAll('.lv').forEach(b => b.onclick = () => load(+b.dataset.i));
    ovShow('ovMenu');
  }

  // --- game loop ---
  function update(dt){
    t += dt;
    if (mode === 'fly'){
      for (let k = 0; k < 4; k++){
        step(probe, dt / 4);
        for (const b of L.b){
          if (Math.hypot(b.x - probe.x, b.y - probe.y) < b.r + 5){
            burst(probe.x, probe.y, b.rep ? '#ff4fa3' : '#ffb020'); respawn(); return;
          }
        }
        if (Math.hypot(L.g[0] - probe.x, L.g[1] - probe.y) < 30){ win(); return; }
      }
      trail.push([probe.x, probe.y]); if (trail.length > 160) trail.shift();
      if (probe.x < -150 || probe.x > WW + 150 || probe.y < -150 || probe.y > WH + 150) respawn();
    }
    for (const p of parts){ p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt * 1.5; }
    parts = parts.filter(p => p.life > 0);
  }
  function win(){
    mode = 'won';
    const n = shots <= 1 ? 3 : shots <= 3 ? 2 : 1;
    prog[li] = Math.max(prog[li] || 0, n); save();
    burst(L.g[0], L.g[1], '#4fd1ff');
    $('winStars').textContent = '★'.repeat(n) + '☆'.repeat(3 - n);
    $('winMsg').textContent = shots === 1 ? 'Clean shot. One launch.' : 'Solved in ' + shots + ' launches. One launch earns three stars.';
    $('next').textContent = li + 1 < LEVELS.length ? 'Next level' : 'All levels';
    setTimeout(() => ovShow('ovWin'), 650);
  }

  function glow(x, y, r, c, a){
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, c); g.addColorStop(1, 'transparent');
    ctx.globalAlpha = a; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.28); ctx.fill(); ctx.globalAlpha = 1;
  }
  function draw(){
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#070b1a'; ctx.fillRect(0, 0, innerWidth, innerHeight);
    ctx.setTransform(DPR * sc, 0, 0, DPR * sc, DPR * ox, DPR * oy);

    for (const s of stars){
      ctx.globalAlpha = .25 + .5 * Math.abs(Math.sin(t * .8 + s.p)) * s.z;
      ctx.fillStyle = '#cfe0ff'; ctx.fillRect(s.x, s.y, 1 + s.z * 1.5, 1 + s.z * 1.5);
    }
    ctx.globalAlpha = 1;
    // play-field frame
    ctx.strokeStyle = 'rgba(79,209,255,.12)'; ctx.lineWidth = 1; ctx.strokeRect(0, 0, WW, WH);

    // bodies
    for (const b of L.b){
      const c = b.rep ? '#ff4fa3' : '#4fd1ff';
      glow(b.x, b.y, b.r * 3.2, c, .22);
      const g = ctx.createRadialGradient(b.x - b.r * .35, b.y - b.r * .35, b.r * .1, b.x, b.y, b.r);
      g.addColorStop(0, b.rep ? '#ffb3d9' : '#bfeeff'); g.addColorStop(1, b.rep ? '#8a1e5a' : '#1c4f9c');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.28); ctx.fill();
      ctx.strokeStyle = c; ctx.globalAlpha = .35; ctx.setLineDash([4, 8]); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 26 + Math.sin(t * 2) * 3, 0, 6.28); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
    }
    // goal gate
    const [gx, gy] = L.g; glow(gx, gy, 70, '#ffb020', .4);
    ctx.strokeStyle = '#ffb020'; ctx.lineWidth = 3;
    for (let i = 0; i < 3; i++){
      ctx.globalAlpha = 1 - i * .28; ctx.beginPath(); ctx.arc(gx, gy, 14 + i * 8 + Math.sin(t * 3 - i) * 2, 0, 6.28); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // start marker
    ctx.strokeStyle = 'rgba(232,239,255,.35)'; ctx.setLineDash([3, 5]); ctx.beginPath(); ctx.arc(L.s[0], L.s[1], 18, 0, 6.28); ctx.stroke(); ctx.setLineDash([]);

    // trail
    if (trail.length > 1){
      for (let i = 1; i < trail.length; i++){
        ctx.strokeStyle = `rgba(255,176,32,${i / trail.length * .8})`; ctx.lineWidth = 1 + i / trail.length * 3;
        ctx.beginPath(); ctx.moveTo(trail[i-1][0], trail[i-1][1]); ctx.lineTo(trail[i][0], trail[i][1]); ctx.stroke();
      }
    }
    // aim preview (short, so you still have to judge the rest)
    if (aim && mode === 'aim'){
      const v = pull(), p = { x: probe.x, y: probe.y, vx: v.vx, vy: v.vy };
      ctx.fillStyle = '#e8efff';
      for (let i = 0; i < 46; i++){
        step(p, 1 / 60);
        if (i % 4 === 0){ ctx.globalAlpha = 1 - i / 46; ctx.beginPath(); ctx.arc(p.x, p.y, 2.4, 0, 6.28); ctx.fill(); }
      }
      ctx.globalAlpha = 1;
      ctx.strokeStyle = 'rgba(232,239,255,.5)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(probe.x, probe.y);
      ctx.lineTo(probe.x - Math.cos(v.a) * v.len, probe.y - Math.sin(v.a) * v.len); ctx.stroke();
    }
    // probe
    if (mode !== 'won'){
      glow(probe.x, probe.y, 28, '#ffb020', .7);
      ctx.fillStyle = '#fff7e0'; ctx.beginPath(); ctx.arc(probe.x, probe.y, 6, 0, 6.28); ctx.fill();
    }
    for (const p of parts){
      ctx.globalAlpha = Math.max(p.life, 0); ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, 2.5, 0, 6.28); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  load(0); openMenu();

  let last = performance.now();
  (function loop(now){
    const dt = Math.min((now - last) / 1000, .05); last = now;
    update(dt); draw(); requestAnimationFrame(loop);
  })(last);

})();
</script>
</body>
</html>
